<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <h1>Gerenciador de Tarefas</h1>
    <p>Digite as tarefas que você quer adicionar:</p>
    <div class ="DivP">
        <p>Digite o nome da sua tarefa:</p>
        <input id ="EntradaTarefa" type="text" required>

        <p>Digite a categoria da sua tarefa (ex: Eletrônica, utilidades, trabalho, importante etc.):</p>
        <input id ="categoriaTarefa" type="text" required>

        <p>Digite a quantidade de vezes que você tem que fazer está lista de tarefas:</p>
        <input id="quantidadeTarefa" type="number" required>

        <button id ="BotaoLançarTarefas" type ="button" name = "botao1">Clique aqui para lançar suas tarefas!</button>

        <ul id ="PaiLista">
            <li id="listaTarefas"></li>
        </ul>
    </div>
    <script src = "index.js" defer></script>
</body>
</html>
